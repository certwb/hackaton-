services:
  - type: web
    name: mangystau-logistics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/checkpoints
    envVars:
      - key: AI_PROVIDER
        value: heuristic
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_MODELS
        value: gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-2.5-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: mangystau-logistics-db
          property: connectionString

databases:
  - name: mangystau-logistics-db
    plan: free
    databaseName: mangystau_logistics
    user: mangystau_logistics
