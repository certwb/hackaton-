services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: heuristic

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

